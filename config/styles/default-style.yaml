name: DefaultStyle
version: 2
options:
  - label: Show Meshes/Polygons
    id: showMesh
    default: false
  - label: Show Points
    id: showPoint
    default: true
  - label: Show Lines
    id: showLine
    default: true
  - label: Inspection Panel Selection Color
    internal: true
    id: selectableFeatureHighlightColor
    type: string
    default: black
    description: selection color which can be set through the attribute panel

# One screen-space material for every vector primitive. The compositor treats
# thin silhouettes as solid highlights and wide silhouettes as bordered areas.
interaction-effects:
  hover:
    tint: yellow
    tint-mix: 1
    edge-width: 1
    halo: {color: black, radius: 5, opacity: 0.22}
    stripe: {spacing: 24, width: 12, opacity: 0.02, angle: 45, offset: 0, softness: 0.9}
  selection:
    tint: {option: selectableFeatureHighlightColor}
    tint-mix: 1
    edge-width: 2
    halo: {color: black, radius: 6, opacity: 0.28}
    stripe: {spacing: 24, width: 12, opacity: 0.05, angle: 45, offset: 0, softness: 0.9}

rules:
  # Normal styles
  - geometry: ["mesh", "polygon"]
    filter: showMesh
    color: teal
    opacity: 0.8
    offset: [0, 0, -0.04]
  - geometry: ["line"]
    filter: showLine
    color: moccasin
    opacity: 1.0
    width: 2.0
    offset: [0, 0, -0.02]
  - geometry: ["point"]
    point-merge-grid-cell: [0.000000084, 0.000000084, 0.01]
    filter: showPoint
    color-scale:
      mode: categorical
      expression: "$mergeCount > 1"
      stops:
        - [false, moccasin]
        - [true, red]
      fallback: moccasin
    label-text-expression: "$mergeCount > 1 and ($mergeCount as string) or ''"
    label-color: black
    label-font: "12px Helvetica"
    opacity: 1.0
    width: 15.0
    offset: [0, 0, -0.01]

  # Semantic hover style: routine feature interaction uses interaction-effects.
  - scope: attribute
    attribute-validity-geom: required
    geometry: ["line"]
    color: green
    opacity: 0.8
    width: 4.0
    glow: {color: black, radius: 5, opacity: 0.28}
    mode: hover
    offset: [0, 0, -0.01]
    offset-increment: [0, 0, -0.01]
